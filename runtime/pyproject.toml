[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-runtime"
version = "0.1.1"
description = "Durable research execution and asynchronous review inbox"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
autoresearch = "autoresearch_runtime.cli:main"
autoresearch-review = "autoresearch_runtime.review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoresearch_runtime = ["inbox.html"]
