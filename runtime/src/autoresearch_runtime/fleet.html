<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research review</title>
<style>body{font:16px system-ui;max-width:1200px;margin:auto;padding:24px;background:#f6f7fa;color:#172034}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}section,article{background:white;border:1px solid #dce1eb;border-radius:10px;padding:18px;margin:16px 0}button,select,input,textarea{font:inherit;padding:8px;border:1px solid #a6b4cb;border-radius:6px}button{cursor:pointer}textarea{width:95%;min-height:80px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #e4e8ef}pre{white-space:pre-wrap;overflow-wrap:anywhere}#notice{color:#a13125}.muted{color:#58677d}</style></head>
<body><header><h1 id="title">Research review</h1><select id="language"><option value="en">English</option><option value="zh-CN">简体中文</option></select><button id="refresh">Refresh</button><span id="freshness" class="muted"></span></header>
<p id="assurance" class="muted"></p><a href="/reports">Reports and evidence · 报告与证据</a><p id="notice" role="status"></p>
<section><h2 id="round-title"></h2><select id="rounds"></select><p id="round-summary"></p><table><thead id="columns"></thead><tbody id="units"></tbody></table></section>
<section><h2 id="evidence-title"></h2><p id="evidence-help"></p><input id="evidence-id" size="68" placeholder="Evidence ID"><button id="open-evidence"></button><pre id="evidence"></pre></section>
<section><h2 id="messages-title"></h2><div id="messages"></div><textarea id="reply"></textarea><input id="reply-to" placeholder="Reply to message ID"><button id="send"></button></section>
<section><h2 id="review-title"></h2><p id="review-help"></p><textarea id="review-json" aria-label="Review decision"></textarea><button id="review-submit"></button></section>
<script>
const $=id=>document.getElementById(id), words={en:{title:'Research review',refresh:'Refresh',rounds:'Rounds and experiment history',evidence:'Released evidence',evidenceHelp:'Open the evidence ID from a report or manifest.',open:'Read evidence',messages:'Questions and replies',send:'Send reply',review:'Next iteration review',reviewHelp:'Submit a review bound to the current selection and the exact next plan.',submit:'Submit review',assurance:'POC access: anonymous. Participant and reviewer identities are self-reported.',columns:['Experiment','Status','Generation','Cost budget'],updated:'Browser refreshed',unavailable:'Refresh failed; last results remain visible.',empty:'No records yet',queued:'Accepted; application at the round boundary is separate.'},'zh-CN':{title:'研究审阅',refresh:'刷新',rounds:'轮次与实验历史',evidence:'已发布证据',evidenceHelp:'使用报告或清单中的证据 ID 阅读证据。',open:'读取证据',messages:'问题与回复',send:'发送回复',review:'下一轮审阅',reviewHelp:'提交绑定当前选择结果和精确下一轮计划的审阅。',submit:'提交审阅',assurance:'POC 匿名访问；参与者及审阅者身份为自行声明。',columns:['实验','状态','代次','预算'],updated:'浏览器刷新时间',unavailable:'刷新失败；保留上次结果。',empty:'暂无记录',queued:'已接受；轮次边界应用是另一项记录。'}};
let locale='en',snapshot={rounds:[],units:[],attempts:[]},selected=null,replyDraft='',reviewDraft='';
const t=key=>words[locale][key], node=(tag,text)=>{let n=document.createElement(tag);n.textContent=text;return n};
function labels(){document.documentElement.lang=locale;for(const [id,key] of Object.entries({'title':'title','refresh':'refresh','round-title':'rounds','evidence-title':'evidence','evidence-help':'evidenceHelp','open-evidence':'open','messages-title':'messages','send':'send','review-title':'review','review-help':'reviewHelp','review-submit':'submit','assurance':'assurance'}))$(id).textContent=t(key);let row=node('tr','');for(const text of t('columns'))row.append(node('th',text));$('columns').replaceChildren(row)}
function render(){labels();$('rounds').replaceChildren(...snapshot.rounds.map(r=>{let option=node('option',r.id+' · '+r.state);option.value=r.id;return option}));if(!selected||!snapshot.rounds.some(r=>r.id===selected))selected=snapshot.rounds.at(-1)?.id;$('rounds').value=selected||'';const round=snapshot.rounds.find(r=>r.id===selected);$('round-summary').textContent=round?round.id+' · '+round.state:t('empty');$('units').replaceChildren(...snapshot.units.filter(u=>u.round===selected).map(u=>{let row=node('tr','');for(const text of [u.id,u.state,String(u.generation),JSON.stringify(u.body.costs)])row.append(node('td',text));return row}))}
async function call(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(result.error||String(response.status));return result}
async function refresh(){try{snapshot=await call('/api/status');render();const value=await call('/api/messages');$('messages').replaceChildren(...value.items.map(m=>{let a=node('article','');a.append(node('strong',m.id),node('p',m.text),node('small',m.in_reply_to?'↳ '+m.in_reply_to:''));return a}));$('freshness').textContent=t('updated')+' · '+new Date().toLocaleTimeString();$('notice').textContent=''}catch(error){$('notice').textContent=t('unavailable')+' '+error.message}}
$('language').onchange=()=>{locale=$('language').value;render()};$('rounds').onchange=()=>{selected=$('rounds').value;render()};$('refresh').onclick=refresh;
$('reply').oninput=()=>replyDraft=$('reply').value;$('review-json').oninput=()=>reviewDraft=$('review-json').value;
$('send').onclick=async()=>{try{const round=snapshot.rounds.find(r=>r.id===selected);if(!round)throw Error(t('empty'));await call('/api/messages',{id:crypto.randomUUID(),project_id:round.project,text:replyDraft,...($('reply-to').value?{in_reply_to:$('reply-to').value}:{})});replyDraft='';$('reply').value='';await refresh();$('notice').textContent=t('queued')}catch(error){$('notice').textContent=error.message}};
$('review-submit').onclick=async()=>{try{await call('/api/review',JSON.parse(reviewDraft));$('notice').textContent=t('queued')}catch(error){$('notice').textContent=error.message}};
$('open-evidence').onclick=async()=>{try{let response=await fetch('/evidence/'+encodeURIComponent($('evidence-id').value),{cache:'no-store'});if(!response.ok)throw Error('Evidence unavailable');$('evidence').textContent=await response.text()}catch(error){$('notice').textContent=error.message}};
refresh();setInterval(refresh,5000);
</script></body></html>
